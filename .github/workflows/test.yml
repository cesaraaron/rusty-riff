name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpipewire-0.3-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check for un-blessed UI snapshots
        # `cargo test` already fails on a snapshot mismatch, but insta
        # leaves a pending `.snap.new` beside it. Fail loudly if any slipped into
        # the tree (a half-finished re-bless) so the diff is never silently ignored.
        run: |
          pending=$(find . -name '*.snap.new' -not -path './target/*')
          if [ -n "$pending" ]; then
            echo "::error::Un-blessed insta snapshots found. Run 'cargo insta review' and commit the .snap files:"
            echo "$pending"
            exit 1
          fi

  # The AudioUnit host (`--features au`) only compiles on macOS, so its tests run
  # here and not in the Linux job. The fidelity baseline was generated on
  # aarch64-apple-darwin, so the `--check` gate lives here too.
  macos:
    name: Tests + Fidelity (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests (all features, incl. AU)
        run: cargo test --all-features

      - name: Check the fidelity baseline
        # Renders every bundled preset over the synthetic corpus and fails on any
        # drift beyond the harness tolerances (loudness, crest, correlation,
        # centroid, LTAS) — the guard on preset/DSP voicing regressions.
        run: cargo run --release --example fidelity_render -- --check docs/fidelity/baseline-synth-48k.toml
