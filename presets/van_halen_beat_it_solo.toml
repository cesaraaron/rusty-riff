name        = "Van Halen — Beat It (Solo)"
description = "Inspired by Eddie Van Halen's guest solo on Michael Jackson's 'Beat It' (1982): a hot, midrangey Plexi lead with a light phase sweep and tape slapback. The record's solo is also double-tracked, which a single preset can't reproduce. Inspired by, not a verified session rig."
tags        = ["van halen", "lead", "rock"]
year        = 1982

# ── Noise Gate ────────────────────────────────────────────────────────────────
[noise_gate]
enabled   = true
threshold = 0.16
release   = 0.30

# TS off — the Plexi's own gain is the sound.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

# ── Amp ───────────────────────────────────────────────────────────────────────
# A dimed Plexi (1959) for the singing, saturated lead voice.
[amp]
model    = "plexi"
gain     = 0.88
bass     = 0.52
mid      = 0.62
treble   = 0.60
presence = 0.56

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Greenback 4×12, close-miked with a little ribbon.
[cabinet]
model     = "marshall"
mic_pos   = 0.52
mic_blend = 0.30
mic_room  = 0.16

# ── Phaser ────────────────────────────────────────────────────────────────────
# A gentle Phase 90-style sweep under the lead.
[phaser]
enabled  = true
rate     = 0.22
depth    = 0.34
feedback = 0.20
mix      = 0.22

# ── Delay ─────────────────────────────────────────────────────────────────────
# Tape slapback to thicken the lead.
[delay]
type     = 1.0
enabled  = true
time     = 0.22
feedback = 0.18
mix      = 0.16

# ── Reverb ────────────────────────────────────────────────────────────────────
[reverb]
enabled = true
room = 0.36
damp = 0.52
mix  = 0.14

[master]
width = 1.0
