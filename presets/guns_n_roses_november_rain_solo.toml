name        = "Guns N' Roses — November Rain (Solo)"
description = "Inspired by Slash's lead on 'November Rain' (Use Your Illusion, 1991): a Les Paul into a hot JCM800-style Marshall. The wide, sustained delay/reverb is the record's mix as much as the rig. Inspired by, not a verified session rig."
year        = 1991

# ── Noise Gate ────────────────────────────────────────────────────────────────
[noise_gate]
enabled   = true
threshold = 0.14
release   = 0.34

# TS off — the Marshall's own gain carries the lead.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

# ── Amp ───────────────────────────────────────────────────────────────────────
# A hot, mid-forward Marshall lead.
[amp]
model    = "marshall"
gain     = 0.80
bass     = 0.52
mid      = 0.58
treble   = 0.58
presence = 0.52
master   = 0.62

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Marshall 4×12, close-miked with a touch of room.
[cabinet]
model     = "marshall"
mic_pos   = 0.52
mic_blend = 0.28
mic_room  = 0.20

# ── Delay ─────────────────────────────────────────────────────────────────────
# A long, wide delay for the sustained, orchestral lead.
[delay]
type     = 1.0
enabled  = true
time     = 0.40
feedback = 0.34
mix      = 0.28

# ── Reverb ────────────────────────────────────────────────────────────────────
[reverb]
enabled = true
room = 0.52
damp = 0.46
mix  = 0.24

[master]
width = 1.0
