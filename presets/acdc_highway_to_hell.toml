name        = "AC/DC — Highway to Hell"
description = "Inspired by the cleaner end of the Young tone (Highway to Hell, 1979): a Plexi at edge-of-breakup with Greenbacks — no pedals, no reverb. Not a verified session rig."
year        = 1979

# ── Noise Gate ────────────────────────────────────────────────────────────────
[noise_gate]
enabled   = true
threshold = 0.09
release   = 0.46

# No drive pedals: the Plexi alone carries the gain.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

# ── Amp ───────────────────────────────────────────────────────────────────────
# Plexi at edge of breakup: chords ring clean until you dig in, then the power
# section bites.
[amp]
model  = "plexi"
gain   = 0.52
bass   = 0.42
mid    = 0.60
treble = 0.60
presence = 0.52

# ── Cabinet ───────────────────────────────────────────────────────────────────
[cabinet]
model     = "marshall"
mic_pos   = 0.52
mic_blend = 0.22
mic_room  = 0.18

[reverb]
enabled = false
room = 0.32
damp = 0.52
mix  = 0.0

[master]
width = 1.0
