name        = "AC/DC — Highway to Hell"
description = "Inspired by the cleaner end of the Young tone (Highway to Hell, 1979): a Plexi at edge-of-breakup with Greenbacks and a touch of TS bite — no reverb. Not a verified session rig."
tags        = ["ac/dc", "rhythm", "hard rock"]
year        = 1979

# ── Noise Gate ────────────────────────────────────────────────────────────────
[noise_gate]
enabled   = true
threshold = 0.09
release   = 0.46

# TS as a very low-drive bite boost at edge-of-breakup (a deliberate break from
# the strict "no pedals" claim).
[tube_screamer]
enabled = true
drive = 0.12
tone  = 0.55
level = 0.58

# ── Amp ───────────────────────────────────────────────────────────────────────
# Plexi at edge of breakup: chords ring clean until you dig in, then the power
# section bites.
[amp]
model  = "plexi"
gain   = 0.52
bass   = 0.42
mid    = 0.60
treble = 0.60
presence = 0.52

# ── Cabinet ───────────────────────────────────────────────────────────────────
[cabinet]
model     = "marshall"
mic_pos   = 0.52
mic_blend = 0.22
mic_room  = 0.18

[reverb]
enabled = false
room = 0.32
damp = 0.52
mix  = 0.0

[master]
width = 1.0
