name        = "Pink Floyd — Time (Solo)"
description = "Inspired by the 'Time' solo (The Dark Side of the Moon, 1973): a Fuzz Face into a Hiwatt DR103 and Fane-loaded WEM 4×12, with a Uni-Vibe-style swirl and a tape echo. Biting and vocal, not a fuzz wall. Not a verified session rig."
year        = 1973

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Moderate — the Time solo is articulate and choppy, so the gate closes a little
# faster than on the ballads.
[noise_gate]
enabled   = true
threshold = 0.14
release   = 0.36

# ── Compressor ────────────────────────────────────────────────────────────────
# A light squeeze only. Time is played with attack and bite — heavy compression
# would flatten the phrasing that makes the solo speak.
[compressor]
enabled = true
sustain = 0.42
attack  = 0.30
level   = 0.52

# ── Fuzz Face ─────────────────────────────────────────────────────────────────
# The Time solo is a Fuzz Face, not a Muff: type 0.5 selects the softer, mid-rich
# voicing. Gritty and vocal with the tone up so it snarls instead of smoothing over.
[fuzz]
enabled = true
type    = 0.5   # 0 = Big Muff, 0.5 = Fuzz Face, 1 = Tone Bender
fuzz    = 0.55
tone    = 0.62
level   = 0.55

# TS off — the fuzz into the driven amp is the sound.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Mids pushed for the vocal snarl, lows trimmed so fast low-note runs stay clear.
[preamp_eq]
enabled = false
low  = 0.42
mid  = 0.62
high = 0.58

# ── Uni-Vibe ──────────────────────────────────────────────────────────────────
# The signature DSOTM swirl, in front of the amp: moderate depth in chorus mode.
[uni_vibe]
enabled = true
rate    = 0.28
depth   = 0.50
mix     = 0.45
mode    = 0.0   # 0 = chorus, 1 = vibrato

# ── Amp ───────────────────────────────────────────────────────────────────────
# Hiwatt DR103, the real front end for the Dark Side tones: clean, tight and
# bright, driven by the Fuzz Face rather than by its own gain.
[amp]
model  = "hiwatt"
gain   = 0.46
bass   = 0.42
mid    = 0.60
treble = 0.62
presence = 0.58
master = 0.55

# ── Cabinet ───────────────────────────────────────────────────────────────────
# WEM 4×12 with Fane Crescendos — the bright, aggressive cab Gilmour used with
# the Hiwatt, leaner and more open than a Greenback.
[cabinet]
model     = "wem"
mic_pos   = 0.54
mic_blend = 0.22
mic_room  = 0.24

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# A mid-forward finish with the lows kept in check and a little air up top.
[eq]
enabled = false
low  = 0.42
mid  = 0.56
high = 0.58

# Chorus off — the Uni-Vibe carries the modulation, as on the record.
[chorus]
enabled = false
rate  = 0.22
depth = 0.40
mix   = 0.0

[flanger]
enabled  = false
rate     = 0.20
depth    = 0.30
feedback = 0.20
mix      = 0.0

# ── Delay ─────────────────────────────────────────────────────────────────────
# Echorec-style ~310 ms repeats, present enough to fill the gaps between the
# clipped phrases without washing them together.
[delay]
type     = 1.0   # tape (Echorec-style drum echo approximates as tape)
enabled  = true
time     = 0.62
feedback = 0.34
mix      = 0.24

# ── Reverb ────────────────────────────────────────────────────────────────────
# A medium room, lightly damped — depth without blurring the attack.
[reverb]
enabled = true
room = 0.48
damp = 0.48
mix  = 0.16

[master]
width = 1.0
