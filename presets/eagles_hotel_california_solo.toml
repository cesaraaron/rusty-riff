name        = "Eagles — Hotel California (Solo)"
description = "Inspired by the harmonized 'Hotel California' outro (1976), recorded as two separate lead parts (Felder: 1959 Les Paul into a cranked tweed Deluxe; Walsh: Telecaster into a small solid-state combo). This single preset approximates the tweed Deluxe voice. Not a verified session rig."
year        = 1976

# ── Noise Gate ────────────────────────────────────────────────────────────────
# A driven lead hisses between phrases, so the gate works harder than a clean tone
# would — but the threshold stays low and the release slow so held bends and their
# reverb tails are never chopped off mid-sustain.
[noise_gate]
enabled   = true
threshold = 0.14
release   = 0.42

# No drive pedals — the lead is guitar straight into the amp.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.56
level = 0.78

# ── Amp ───────────────────────────────────────────────────────────────────────
# Tweed Deluxe, Volume up: the cathode-biased 6V6 power section supplies the warm,
# compressed, vocal breakup, and its 5Y3 sag gives held bends their bloom.
[amp]
model  = "tweed"
gain   = 0.82
treble = 0.62

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Tweed 1×12 open-back — warm and vocal, with enough room to hear the amp breathe.
[cabinet]
model     = "tweed"
mic_pos   = 0.48
mic_blend = 0.30
mic_room  = 0.28

# ── Delay ─────────────────────────────────────────────────────────────────────
# A modest ~200 ms repeat for depth and to let phrase-ends hang.
[delay]
enabled  = true
time     = 0.40
feedback = 0.28
mix      = 0.18

# ── Reverb ────────────────────────────────────────────────────────────────────
# A warm medium hall — the solo sits in the room, not a cathedral.
[reverb]
enabled = true
room = 0.47
damp = 0.55
mix  = 0.20

[master]
width = 1.0
