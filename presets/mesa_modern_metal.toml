name        = "Modern Metal — Recto Rhythm"
description = "A tight modern high-gain rhythm: TS tightener into a Recto-style Modern channel and a V30 4x12. Dry and gated — add room to taste. Not a verified session rig."
tags        = ["metal", "rhythm", "high gain"]

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Tight and fast — djenty stops must mute hard between chugs.
[noise_gate]
enabled   = true
threshold = 0.22
release   = 0.25

# TS as a tightener, not a drive: gain near zero, level pushing the input,
# tone up to keep the low end from flubbing.
[tube_screamer]
enabled = true
drive = 0.15
tone  = 0.62
level = 0.85

# ── Amp ───────────────────────────────────────────────────────────────────────
# Dual Rectifier Modern voice: silicon-rectifier sag stays stiff so the attack
# punches, mids scooped, presence up for cut.
[amp]
model    = "mesa"
gain     = 0.78
bass     = 0.45
mid      = 0.35
treble   = 0.62
presence = 0.55
master   = 0.60

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Mesa 4x12 just off-centre, mostly close dynamic with a little room glue.
[cabinet]
model     = "mesa"
mic_pos   = 0.55
mic_blend = 0.25
mic_room  = 0.12

[reverb]
enabled = false
room = 0.30
damp = 0.50
mix  = 0.0

[master]
width = 1.0
