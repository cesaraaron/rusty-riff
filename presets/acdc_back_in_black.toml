name        = "AC/DC — Back in Black"
description = "Inspired by Angus Young's rhythm crunch (Back in Black, 1980): guitar straight into a cranked Plexi and Greenbacks — no pedals, no reverb. Not a verified session rig."
tags        = ["ac/dc", "rhythm", "hard rock"]
year        = 1980

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Light and slow — the tone is dry but the gated stops between chords must ring.
[noise_gate]
enabled   = true
threshold = 0.10
release   = 0.44

# No drive pedals: the Plexi alone carries the gain.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

# ── Amp ───────────────────────────────────────────────────────────────────────
# Marshall Super Lead "Plexi" pushed hard on the channel volume: the power amp's
# compression and grind, not preamp distortion, is the whole sound.
[amp]
model  = "plexi"
gain   = 0.68
bass   = 0.44
mid    = 0.62
treble = 0.56
presence = 0.50

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Greenbacks just off-axis with very little room — dry and immediate, as on the
# record.
[cabinet]
model     = "marshall"
mic_pos   = 0.52
mic_blend = 0.22
mic_room  = 0.14

[reverb]
enabled = false
room = 0.30
damp = 0.58
mix  = 0.0

[master]
width = 1.0
