name        = "Pink Floyd — Shine On You Crazy Diamond"
description = "Inspired by the 'Shine On You Crazy Diamond' lead (Wish You Were Here, 1975): a Fuzz Face into a Hiwatt and Fane 4×12, pushed by a Power-Boost-style clean boost, with a long tape echo standing in for the Binson Echorec. Not a verified session rig."
year        = 1975

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Light and slow — long sustained bends must never be gated.
[noise_gate]
enabled   = true
threshold = 0.10
release   = 0.50

# ── Compressor ────────────────────────────────────────────────────────────────
# A light studio squeeze so the sustained bends stay even.
[compressor]
enabled = true
sustain = 0.30
attack  = 0.40
level   = 0.52

# ── Fuzz ──────────────────────────────────────────────────────────────────────
# A Fuzz Face — Gilmour's fuzz through 1975 (the Big Muff arrives ~1977).
[fuzz]
enabled = true
type    = 0.5   # 0 = Big Muff, 0.5 = Fuzz Face, 1 = Tone Bender
fuzz    = 0.66
tone    = 0.54
level   = 0.58

# TS off — the Tube Screamer is a 1979 pedal; the Shine On lead predates it.
[tube_screamer]
enabled = false
drive = 0.16
tone  = 0.56
level = 0.66

# ── Clean boost ───────────────────────────────────────────────────────────────
# Colorsound Power Boost, used heavily on Wish You Were Here — hits the Hiwatt's
# front end for the singing sustain without adding a pedal's own clipping.
[boost]
enabled = true
gain    = 0.50
treble  = 0.50
bass    = 0.50

# ── Amp ───────────────────────────────────────────────────────────────────────
# Hiwatt DR103, clean and tight, letting the Fuzz Face and boost carry the voice.
[amp]
model  = "hiwatt"
gain   = 0.50
bass   = 0.42
treble = 0.60
mid    = 0.58
presence = 0.56
master = 0.56

# ── Cabinet ───────────────────────────────────────────────────────────────────
# WEM 4×12 with Fane Crescendos — bright and open under the fuzz.
[cabinet]
model     = "wem"
mic_pos   = 0.54
mic_blend = 0.22
mic_room  = 0.24

# ── Delay ─────────────────────────────────────────────────────────────────────
# A long tape echo — the closest stand-in for the Binson Echorec (the main echo
# until ~1977; no Echorec model yet).
[delay]
enabled  = true
type     = 1.0
time     = 0.66
feedback = 0.40
mix      = 0.26

# ── Reverb ────────────────────────────────────────────────────────────────────
# A wide medium room to hold the long notes.
[reverb]
enabled = true
room = 0.52
damp = 0.48
mix  = 0.20

[master]
width = 1.0
