name        = "Pink Floyd — Money"
description = "Inspired by the 'Money' voice (The Dark Side of the Moon, 1973): a Fuzz Face into a Hiwatt with the wah sweeping ahead of it (the auto-wah stands in for a rocked treadle) and a tape echo. Not a verified session rig."
tags        = ["pink floyd", "lead", "classic rock"]
year        = 1973

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Medium — the fuzz is noisy and the riff is full of rests.
[noise_gate]
enabled   = true
threshold = 0.14
release   = 0.36

[compressor]
enabled = false
sustain = 0.40
attack  = 0.30
level   = 0.50

# ── Fuzz Face ─────────────────────────────────────────────────────────────────
# type 0.5 = Fuzz Face: softer and more vocal than the Muff, and it cleans up
# when you roll the guitar back.
[fuzz]
enabled = true
type    = 0.5   # 0 = Big Muff, 0.5 = Fuzz Face, 1 = Tone Bender
fuzz    = 0.60
tone    = 0.58
level   = 0.55

# ── Wah ───────────────────────────────────────────────────────────────────────
# The parked-then-sweeping wah that defines the riff, ahead of the fuzz. This is
# an auto-wah (it follows your attack); a manually rocked treadle is not modelled.
[wah]
enabled = true
freq = 0.55
sens = 0.30
q    = 0.62
mix  = 0.85

[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

[preamp_eq]
enabled = false
low  = 0.44
mid  = 0.56
high = 0.56

[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

# ── Amp ───────────────────────────────────────────────────────────────────────
# Hiwatt DR103, clean and authoritative, driven by the fuzz and wah rather than
# by its own gain.
[amp]
model  = "hiwatt"
gain   = 0.44
bass   = 0.42
treble = 0.60
mid    = 0.58
presence = 0.56
master = 0.56

# ── Cabinet ───────────────────────────────────────────────────────────────────
# WEM 4×12 with Fane Crescendos — bright, aggressive and open.
[cabinet]
model     = "wem"
mic_pos   = 0.54
mic_blend = 0.22
mic_room  = 0.22

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# A mid-forward finish with the lows kept tight.
[eq]
enabled = false
low  = 0.42
mid  = 0.56
high = 0.58

[chorus]
enabled = false
rate  = 0.22
depth = 0.40
mix   = 0.0

[flanger]
enabled  = false
rate     = 0.20
depth    = 0.30
feedback = 0.20
mix      = 0.0

[phaser]
enabled  = false
rate     = 0.28
depth    = 0.50
feedback = 0.30
mix      = 0.0

# ── Delay ─────────────────────────────────────────────────────────────────────
# Echorec drum echo, a few repeats trailing the riff.
[delay]
enabled  = true
type     = 0.5   # Echorec drum echo
time     = 0.58
feedback = 0.34
mix      = 0.22

# ── Reverb ────────────────────────────────────────────────────────────────────
# A medium room, lightly damped.
[reverb]
enabled = true
room = 0.46
damp = 0.50
mix  = 0.16

[master]
width = 1.0
