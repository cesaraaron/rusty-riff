name        = "Pink Floyd — Comfortably Numb (Outro Solo)"
description = "Inspired by the outro 'Comfortably Numb' solo (The Wall, 1979): a thick Big Muff-style fuzz into a Hiwatt DR103 and Fane-loaded WEM 4×12, an Electric Mistress-style flanger, long tape repeats and a big hall. Not a verified session rig."
tags        = ["pink floyd", "lead", "classic rock"]
year        = 1979

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Slow release so the long, held bends and their delay/reverb tails ring out.
[noise_gate]
enabled   = true
threshold = 0.14
release   = 0.50

# ── Compressor ────────────────────────────────────────────────────────────────
# Heavier squeeze than the first solo — the outro is about infinite sustain.
[compressor]
enabled = true
sustain = 0.58
attack  = 0.34
level   = 0.52

# ── Big Muff (Fuzz) ───────────────────────────────────────────────────────────
# The Ram's-Head heart of the outro: live-matched against the isolated outro
# guitar (fuzz 0.39, level 0.25 — far back from the old 0.64/0.55, which drove
# the stack into mud). Bright tone keeps it a violin, not a mud slide.
[fuzz]
enabled = true
type    = 0.0   # 0 = Big Muff (the Ram's-Head voice)
fuzz  = 0.39
tone  = 0.60
level = 0.25

# TS off — the Muff is the only dirt.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Push the vocal mids, cut the lows hard (this is where the old preset went
# muddy), and keep the top open enough to cut through the wash.
[preamp_eq]
enabled = false
low  = 0.40
mid  = 0.62
high = 0.54

# Uni-Vibe off — the outro swirl is the Mistress-style flanger.
[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

# ── Amp ───────────────────────────────────────────────────────────────────────
# Phase 7 joint re-voice. Live-matched near-zero bass/mid proved the model
# stacked ~+12 dB of structural lows (WEM pile-up + Hiwatt +4 dB body lift +
# excursion); the model was leaned, then bass/mid walked back up until the
# render nulled vs the matched tone (LUFS −0.01 dB, centroid −0.4%,
# residual ±2 dB narrow-shape). Knobs near noon again, as on the real rig.
[amp]
model  = "hiwatt"
gain   = 0.40
bass   = 0.20
mid    = 0.28
treble = 0.65
presence = 0.56
master = 0.40

# ── Cabinet ───────────────────────────────────────────────────────────────────
# WEM 4×12 with Fane Crescendos, near on-axis, light ribbon, a touch of room. No
# dark cab here — the outro needs to sing, not smoulder.
[cabinet]
model     = "wem"
mic_pos   = 0.52
mic_blend = 0.22
mic_room  = 0.30

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# Low end trimmed again at the end of the chain, mids forward, air on top.
[eq]
enabled = false
low  = 0.40
mid  = 0.58
high = 0.55

# Chorus off — the Mistress is a flanger, modelled in [flanger] below.
[chorus]
enabled = false
rate  = 0.20
depth = 0.50
mix   = 0.0

# ── Flanger (Electric Mistress) ───────────────────────────────────────────────
# The Leslie-like Mistress swirl, proud enough to hear the motion — a signature
# of the outro, not a subtle halo.
[flanger]
enabled  = true
rate     = 0.18
depth    = 0.42
feedback = 0.25
mix      = 0.26
type     = 1.0   # Electric Mistress (mono)

# ── Delay ─────────────────────────────────────────────────────────────────────
# A long ~450 ms Echorec repeat blooming behind each phrase — the
# outro's sense of space. Feedback/mix held below the point of turning to fog.
[delay]
type     = 0.5   # Echorec drum echo
enabled  = true
time     = 0.90
feedback = 0.36
mix      = 0.26

# ── Reverb ────────────────────────────────────────────────────────────────────
# A big, fairly bright hall — the arena the outro floats in.
[reverb]
enabled = true
room = 0.55
damp = 0.48
mix  = 0.20

[master]
width = 1.0
