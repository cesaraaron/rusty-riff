name        = "British Chime — AC30 Clean"
description = "Edge-of-breakup Top Boost chime through an Alnico-style 2x12: dig in and it barks, back off and it sparkles. Light compression and room. Not a verified session rig."
tags        = ["clean", "rock", "pop"]

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Barely there — cleans must breathe, just catch the hum between phrases.
[noise_gate]
enabled   = true
threshold = 0.08
release   = 0.50

# Gentle optical-style squeeze so fingerpicked verses sit with strummed choruses.
[compressor]
enabled = true
sustain = 0.30
attack  = 0.45
level   = 0.55

# TS off — the Top Boost channel breaks up on its own.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

# ── Amp ───────────────────────────────────────────────────────────────────────
# AC30 Top Boost at the sweet spot: volume where clean turns to snarl. Cut low
# keeps the top glassy instead of harsh; no global NFB is the elastic give.
[amp]
model  = "vox"
gain   = 0.55
bass   = 0.50
treble = 0.62
cut    = 0.25

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Vox 2x12 near-centre with room air — the open, jangly half of the sound.
[cabinet]
model     = "vox"
mic_pos   = 0.55
mic_blend = 0.30
mic_room  = 0.22

# ── Reverb ────────────────────────────────────────────────────────────────────
[reverb]
enabled = true
room = 0.45
damp = 0.40
mix  = 0.22

[master]
width = 1.0
