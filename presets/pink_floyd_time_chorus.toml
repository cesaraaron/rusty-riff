name        = "Pink Floyd — Time (Intro / Verse / Chorus)"
description = "Inspired by clean Dark Side rhythm (1973): a clean Hiwatt DR103 and Fane WEM 4×12, a whisper of Uni-Vibe and a low tape echo. Not a verified session rig."
year        = 1973

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Light and slow: the delayed repeats and the vibe tail have to ring out.
[noise_gate]
enabled   = true
threshold = 0.06
release   = 0.40

# ── Compressor ────────────────────────────────────────────────────────────────
# Off. The recorded chorus is dynamic and clean — the Dyna Comp squash is what
# was flattening the transients and pushing up the low-level mud. Values kept
# light so the pedal can be nudged back on if a touch of evening is wanted.
[compressor]
enabled = false
sustain = 0.10
attack  = 0.20
level   = 0.50

# ── Fuzz Face ─────────────────────────────────────────────────────────────────
# Off. The isolated chorus is clean — no fuzz fur, just the amp and pedals.
# type 0.5 = Fuzz Face; values retained so it can be dialled back in.
[fuzz]
enabled = false
type    = 0.5   # 0 = Big Muff, 0.5 = Fuzz Face, 1 = Tone Bender
fuzz    = 0.25
tone    = 0.62
level   = 0.50

[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Lows trimmed for clarity, mids left open, top lifted for the bright, glassy
# top the isolated guitar carries.
[preamp_eq]
enabled = false
low  = 0.40
mid  = 0.52
high = 0.56

# ── Uni-Vibe ──────────────────────────────────────────────────────────────────
# A whisper of the DSOTM throb — audible movement only, no wobble or wash.
[uni_vibe]
enabled = true
rate    = 0.24
depth   = 0.35
mix     = 0.10
mode    = 0.0   # 0 = chorus, 1 = vibrato

# ── Amp ───────────────────────────────────────────────────────────────────────
# Clean Hiwatt DR103 — the amp stays clean and the guitar colours it, exactly as
# on the record. Gain just high enough for the string bloom, no clipping edge.
[amp]
model  = "hiwatt"
gain   = 0.28
bass   = 0.40
mid    = 0.54
treble = 0.60
presence = 0.55
master = 0.62

# ── Cabinet ───────────────────────────────────────────────────────────────────
# WEM 4×12 with Fane Crescendos — bright and open, close-mic'd and dry (almost
# no room) so the tone stays tight and articulate.
[cabinet]
model     = "wem"
mic_pos   = 0.52
mic_blend = 0.15
mic_room  = 0.08

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# Final shaping: lows cut for clarity, mids left open, a lift of air on top.
[eq]
enabled = false
low  = 0.40
mid  = 0.52
high = 0.56

# Chorus off — the Uni-Vibe carries the modulation.
[chorus]
enabled = false
rate  = 0.20
depth = 0.40
mix   = 0.0

[flanger]
enabled  = false
rate     = 0.18
depth    = 0.30
feedback = 0.20
mix      = 0.0

# ── Delay ─────────────────────────────────────────────────────────────────────
# The dotted-eighth Echorec figure (~375 ms) that defines the intro and
# verses — low in the mix so it reads as a rhythmic echo, not a wash.
[delay]
type     = 0.5   # Echorec drum echo
enabled  = true
time     = 0.75
feedback = 0.28
mix      = 0.12

# ── Reverb ────────────────────────────────────────────────────────────────────
# Barely there — just enough to seat the cab in a room without adding fog.
[reverb]
enabled = true
room = 0.45
damp = 0.50
mix  = 0.05

[master]
width = 1.0
