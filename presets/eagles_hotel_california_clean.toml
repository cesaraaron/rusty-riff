name        = "Eagles — Hotel California (Clean)"
description = "Inspired by the clean side of 'Hotel California' (1976), commonly reported as a 12-string acoustic rather than a Twin: this preset is a blackface-style Twin clean with spring reverb and a little chorus/room. Not a verified match."
tags        = ["eagles", "clean", "classic rock"]
year        = 1976

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Very light — a clean tone is quiet between phrases, and a hard gate would clip
# the reverb and chorus tails.
[noise_gate]
enabled   = true
threshold = 0.08
release   = 0.48

# ── Compressor ────────────────────────────────────────────────────────────────
# A gentle squeeze for even arpeggios, slow attack to keep the pick definition.
[compressor]
enabled = true
sustain = 0.34
attack  = 0.45
level   = 0.52

[fuzz]
enabled = false
type    = 0.0
fuzz    = 0.50
tone    = 0.50
level   = 0.60

[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Kept close to flat, with a touch of top for the sparkle.
[preamp_eq]
enabled = false
low  = 0.48
mid  = 0.50
high = 0.54

[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

# ── Amp ───────────────────────────────────────────────────────────────────────
# Fender Twin Reverb, blackface: high headroom and glassy, with the onboard
# spring reverb up a little. The Twin has no master or presence — the extra knobs
# (Reverb/Speed/Intensity) come from the per-model [amp.knobs] table.
[amp]
model  = "fender"
gain   = 0.42
bass   = 0.50
mid    = 0.38
treble = 0.56
[amp.knobs]
reverb    = 0.30
speed     = 0.0
intensity = 0.0

# ── Cabinet ───────────────────────────────────────────────────────────────────
# The Twin's open-back 2×12 with Jensen-style speakers: bright, scooped and open.
[cabinet]
model     = "fender"
mic_pos   = 0.50
mic_blend = 0.24
mic_room  = 0.22

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# A gentle top lift for the acoustic-like shimmer.
[eq]
enabled = true
low  = 0.48
mid  = 0.50
high = 0.56

# ── Chorus ────────────────────────────────────────────────────────────────────
# The lush doubling over the arpeggios — slow, deep and fairly wet.
[chorus]
enabled = true
rate  = 0.20
depth = 0.60
mix   = 0.46

[flanger]
enabled  = false
rate     = 0.20
depth    = 0.30
feedback = 0.20
mix      = 0.0

[phaser]
enabled  = false
rate     = 0.28
depth    = 0.50
feedback = 0.30
mix      = 0.0

# ── Delay ─────────────────────────────────────────────────────────────────────
# A soft dotted-ish repeat for space, low in the mix.
[delay]
enabled  = true
type     = 0.0
time     = 0.42
feedback = 0.26
mix      = 0.14

# ── Reverb ────────────────────────────────────────────────────────────────────
# A warm medium room on top of the amp's spring reverb.
[reverb]
enabled = true
room = 0.52
damp = 0.46
mix  = 0.24

[master]
width = 1.0
