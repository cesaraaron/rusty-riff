name        = "Led Zeppelin — Whole Lotta Love"
description = "Inspired by the 'Whole Lotta Love' riff tone (1969): a Tone Bender-style fuzz into a cranked Plexi and Greenbacks — thick, greasy and mid-rich. The record is reported to use a Vox Super Beatle; not a verified session rig."
tags        = ["led zeppelin", "riff", "classic rock"]
year        = 1969

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Low and slow: the riff is full of stops and starts, and the fuzz's own gating
# must not be doubled up by a hard gate.
[noise_gate]
enabled   = true
threshold = 0.12
release   = 0.40

# ── Compressor ────────────────────────────────────────────────────────────────
# Off: the Tone Bender already compresses hard and the riff needs its attack.
[compressor]
enabled = false
sustain = 0.40
attack  = 0.30
level   = 0.50

# ── Tone Bender MkII ──────────────────────────────────────────────────────────
# type 1.0 selects the MkII — hotter and harder-kneed than a Fuzz Face, with the
# mids kept in. Sustain high, tone up so the bite cuts through.
[fuzz]
enabled = true
type    = 1.0   # 0 = Big Muff, 0.5 = Fuzz Face, 1 = Tone Bender
fuzz    = 0.72
tone    = 0.60
level   = 0.52

# TS as a low-drive bite boost after the Tone Bender, before the Plexi.
[tube_screamer]
enabled = true
drive = 0.15
tone  = 0.60
level = 0.60

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Mids forward, lows tightened so the fuzz's wall stays defined.
[preamp_eq]
enabled = true
low  = 0.42
mid  = 0.62
high = 0.56

[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

# ── Amp ───────────────────────────────────────────────────────────────────────
# Marshall Super Lead "Plexi" with the channel volume up: the power section sags
# and grinds under the fuzz, which is what gives the riff its weight.
[amp]
model  = "plexi"
gain   = 0.66
bass   = 0.48
mid    = 0.60
treble = 0.60
presence = 0.54

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Greenbacks near on-axis — the warm, mid-forward cab the riff was cut on.
[cabinet]
model     = "marshall"
mic_pos   = 0.54
mic_blend = 0.20
mic_room  = 0.22

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# A final mid lift and gentle low tuck so the fuzz sits in the arrangement.
[eq]
enabled = true
low  = 0.44
mid  = 0.58
high = 0.54

[chorus]
enabled = false
rate  = 0.22
depth = 0.40
mix   = 0.0

[flanger]
enabled  = false
rate     = 0.20
depth    = 0.30
feedback = 0.20
mix      = 0.0

[phaser]
enabled  = false
rate     = 0.28
depth    = 0.50
feedback = 0.30
mix      = 0.0

# ── Delay ─────────────────────────────────────────────────────────────────────
# A short slapback — just a hint of room around the riff, not an echo.
[delay]
enabled  = true
type     = 1.0   # tape
time     = 0.30
feedback = 0.20
mix      = 0.12

# ── Reverb ────────────────────────────────────────────────────────────────────
# A tight, damped room so the riff stays dry and punchy.
[reverb]
enabled = true
room = 0.35
damp = 0.55
mix  = 0.12

[master]
width = 1.0
