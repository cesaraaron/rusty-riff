name        = "Pink Floyd — Comfortably Numb (Solo 1)"
description = "Inspired by the first 'Comfortably Numb' solo (The Wall, 1979): a Big Muff-style fuzz into a Hiwatt DR103 and Fane-loaded WEM 4×12, a hint of flanger and a long tape echo. Bright and vocal. Not a verified session rig."
year        = 1979

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Light and slow: the Muff's hiss is real, but a fading bend has to ring out.
[noise_gate]
enabled   = true
threshold = 0.10
release   = 0.45

# ── Compressor ────────────────────────────────────────────────────────────────
# An always-on compressor — Dyna-Comp-style in character (the DSP is a generic
# peak-follower): evens the picking and holds the note up so the lead sings,
# without squashing the dynamics that give it life.
[compressor]
enabled = true
sustain = 0.52
attack  = 0.36
level   = 0.52

# ── Big Muff (Fuzz) ───────────────────────────────────────────────────────────
# Barely a wall here — the first solo is mostly clean amp with the Muff adding
# warmth and sustain under the note. A bright tone keeps it from turning to wool.
[fuzz]
enabled = true
type    = 0.0   # 0 = Big Muff (the Ram's-Head voice)
fuzz  = 0.40
tone  = 0.68
level = 0.50

# TS off — the Muff and the amp do the work.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

[distortion]
enabled = false
drive = 0.40
tone  = 0.50
level = 0.65

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
# Shapes what the amp clips: lows trimmed so the low strings stay clear (the old
# mud), mids lifted for the vocal vowel, top left open and glassy.
[preamp_eq]
enabled = false
low  = 0.42
mid  = 0.60
high = 0.54

# Uni-Vibe off — the Numb solo uses the Mistress-style flanger, not the vibe.
[uni_vibe]
enabled = false
rate    = 0.24
depth   = 0.40
mix     = 0.0
mode    = 0.0

# ── Amp ───────────────────────────────────────────────────────────────────────
# Hiwatt DR103 at modest gain: enough to bloom and sing, with headroom so the
# Muff is a voice, not the whole sound. Bass kept low so the low end stays tight.
[amp]
model  = "hiwatt"
gain   = 0.34
bass   = 0.42
mid    = 0.60
treble = 0.62
presence = 0.56
master = 0.58

# ── Cabinet ───────────────────────────────────────────────────────────────────
# WEM 4×12 with Fane Crescendos, near on-axis with a light ribbon blend — bright
# and present, with a little room for depth.
[cabinet]
model     = "wem"
mic_pos   = 0.50
mic_blend = 0.25
mic_room  = 0.28

# ── Parametric EQ ─────────────────────────────────────────────────────────────
# Gentle final shaping: lows tucked, mids reinforced, a breath of air on top.
[eq]
enabled = false
low  = 0.42
mid  = 0.58
high = 0.56

# Chorus off — the Mistress is a flanger, modelled in [flanger] below.
[chorus]
enabled = false
rate  = 0.18
depth = 0.35
mix   = 0.0

# ── Flanger (Electric Mistress) ───────────────────────────────────────────────
# The Mistress shimmer: shallow and slow, a halo around the note rather than a
# jet-plane sweep — this is the modulation on the Numb solo, not a chorus.
[flanger]
enabled  = true
rate     = 0.15
depth    = 0.30
feedback = 0.20
mix      = 0.20
type     = 1.0   # Electric Mistress (mono)

# ── Delay ─────────────────────────────────────────────────────────────────────
# Echorec repeat: a long ~440 ms echo sitting behind the phrase. Low
# feedback and mix keep it a dimension, not a fog.
[delay]
type     = 0.5   # Echorec drum echo
enabled  = true
time     = 0.88
feedback = 0.30
mix      = 0.22

# ── Reverb ────────────────────────────────────────────────────────────────────
# A medium, fairly damped room — depth without smearing the articulation.
[reverb]
enabled = true
room = 0.45
damp = 0.50
mix  = 0.16

[master]
width = 1.0
