name        = "Pink Floyd — Have a Cigar (Solo)"
description = "Inspired by the lead on 'Have a Cigar' (Wish You Were Here, 1975): a Hiwatt DR103 through a Fane-loaded WEM 4×12, mid-forward with a touch of echo. Inspired by, not a verified session rig."
tags        = ["pink floyd", "lead", "classic rock"]
year        = 1975

# ── Noise Gate ────────────────────────────────────────────────────────────────
[noise_gate]
enabled   = true
threshold = 0.14
release   = 0.34

# ── Compressor ────────────────────────────────────────────────────────────────
[compressor]
enabled = true
sustain = 0.38
attack  = 0.30
level   = 0.52

# TS off — the Hiwatt carries the tone.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

# ── Pre-amp EQ ────────────────────────────────────────────────────────────────
[preamp_eq]
enabled = false
low  = 0.42
mid  = 0.60
high = 0.58

# ── Amp ───────────────────────────────────────────────────────────────────────
# Hiwatt DR103 — clean and bright with plenty of headroom.
[amp]
model    = "hiwatt"
gain     = 0.46
bass     = 0.42
mid      = 0.60
treble   = 0.62
presence = 0.58
master   = 0.55

# ── Cabinet ───────────────────────────────────────────────────────────────────
# WEM 4×12 with Fane Crescendos.
[cabinet]
model     = "wem"
mic_pos   = 0.54
mic_blend = 0.22
mic_room  = 0.22

# ── Parametric EQ ─────────────────────────────────────────────────────────────
[eq]
enabled = false
low  = 0.42
mid  = 0.56
high = 0.58

# ── Delay ─────────────────────────────────────────────────────────────────────
[delay]
type     = 1.0
enabled  = true
time     = 0.50
feedback = 0.28
mix      = 0.20

# ── Reverb ────────────────────────────────────────────────────────────────────
[reverb]
enabled = true
room = 0.46
damp = 0.48
mix  = 0.16

[master]
width = 1.0
