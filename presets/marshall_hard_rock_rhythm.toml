name        = "Hard Rock — JCM800 Rhythm"
description = "Hot-rodded JCM800 rhythm through Greenbacks: guitar straight in, mids forward, power amp doing half the work. The hard-rock workhorse. Not a verified session rig."
tags        = ["hard rock", "rhythm"]

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Medium — tames the hiss without gating the ring of open chords.
[noise_gate]
enabled   = true
threshold = 0.12
release   = 0.35

# No drive pedals: the 800's own cascade carries the gain.
[tube_screamer]
enabled = false
drive = 0.30
tone  = 0.55
level = 0.70

# ── Amp ───────────────────────────────────────────────────────────────────────
# JCM800 with the gain high and the master up: preamp snarl plus power-amp
# compression. Mids forward so the riff sits above the bass.
[amp]
model    = "marshall"
gain     = 0.72
bass     = 0.50
mid      = 0.60
treble   = 0.60
presence = 0.50
master   = 0.60

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Marshall 4x12 close-miked, dry — the riff needs to punch, not wash.
[cabinet]
model     = "marshall"
mic_pos   = 0.52
mic_blend = 0.25
mic_room  = 0.16

[reverb]
enabled = false
room = 0.30
damp = 0.50
mix  = 0.0

[master]
width = 1.0
