name        = "Led Zeppelin — Stairway to Heaven (Solo)"
description = "Inspired by the 'Stairway to Heaven' solo (1971), commonly reported as a Telecaster into a small Supro combo: our Supro-style small combo through a 1×10, with a short slap and a touch of room. Not a verified session rig."
year        = 1971

# ── Noise Gate ────────────────────────────────────────────────────────────────
# Light — the solo's quiet pickup-roll runs must not be clamped.
[noise_gate]
enabled   = true
threshold = 0.12
release   = 0.36

# TS off — the Tube Screamer is a 1979 pedal; the Stairway solo predates it. The
# amp's own breakup carries the lead.
[tube_screamer]
enabled = false
drive = 0.22
tone  = 0.58
level = 0.66

# ── Amp ───────────────────────────────────────────────────────────────────────
# Small Supro-style combo: Volume and Tone, no master. Pushed for the singing,
# compressed small-amp voice.
[amp]
model  = "supro"
gain   = 1.00
treble = 0.60

# ── Cabinet ───────────────────────────────────────────────────────────────────
# Supro 1×10 small combo — the boxy, top-limited small speaker the solo is built
# on. A close mic with a little room.
[cabinet]
model     = "supro"
mic_pos   = 0.50
mic_blend = 0.20
mic_room  = 0.22

# ── Delay ─────────────────────────────────────────────────────────────────────
# A short slap (~130 ms), barely there — it thickens the single note without
# becoming an audible echo. The session echo device is unverified (see
# docs/fidelity-references.md).
[delay]
enabled  = true
type     = 0.0
time     = 0.26
feedback = 0.18
mix      = 0.14

# ── Reverb ────────────────────────────────────────────────────────────────────
# A small, damped room — enough to place the amp in a space, not a hall.
[reverb]
enabled = true
room = 0.38
damp = 0.52
mix  = 0.14

[master]
width = 1.0
